[build-system]
requires = ["setuptools==80.9.0"]
build-backend = "setuptools.build_meta"

[project]
name = "neuro"
readme = "README.md"
version = "2.8.0"
# Both hosts run 3.14 now (zz-imi's venvs were rebuilt off 3.10.12) — a
# py3-none-any wheel installs anywhere and only fails at import, so the floor is
# declared here rather than discovered on the host (PLAN-2026-130 step 4). ruff
# reads this as its target-version: raising it is what lets PEP 701 f-strings
# through, so it must not drift below what the hosts actually run.
requires-python = ">=3.14"
dependencies = [
    "beautifulsoup4>=4.12.0",
    "click>=8.1.0",
    "deepdiff>=6.7.1",
    "docker>=7.1.0",
    "invoke>=2.2.1",
    "killport>=1.2.0",
    "lxml>=5.1.0",
    "neo4j>=6.1.0",
    "pillow>=10.2.0",
    "psutil>=5.9.7",
    "pyexiv2>=2.15.3",
    "pyperclip>=1.9.0",
    "python-dotenv>=1.0.1",
    "python-magic>=0.4.27",
    "pytz>=2024.1",
    "requests>=2.31.0",
    "rich>=13.9.4",
    "tqdm>=4.66.1",
    "urllib3>=2.1.0"
]

[project.optional-dependencies]
dev = [
    "pytest==9.0.2",
    "ruff==0.16.7",
]

[project.scripts]
neuro = "neuro.tools.terminal.cli:cli"

[project.urls]
repository = "https://github.com/neuroforest/neuro"

[tool.pytest.ini_options]
markers = [
    "integration: integration tests (TW5 webserver API and NeuroBase)",
    "e2e: end-to-end tests",
    "unit: unit tests (no database or external dependencies)",
]

[tool.setuptools.packages.find]
include = ["neuro*"]
exclude = ["build*", "tests*", "venv*"]

[tool.ruff.lint]
# Declared, not inherited: ruff 0.16 widened its defaults from 59 rules to 413,
# so upgrading the binary silently redefines what "lint" means here. This is the
# set that was in force before the version was pinned; widening it is a
# deliberate commit, one rule family at a time.
select = ["E4", "E7", "E9", "F"]
